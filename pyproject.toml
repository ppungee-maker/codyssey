[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codyssey"
version = "0.1.0"
description = "코디세이 사이트 QA 자동화 (Playwright, 항상 headed, 세션 재사용)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.61.0",
    "httpx",
    # PDF → 네이토 첨부 변환(naeto_pdf.py). 서버가 type:"pdf" 를 모델에 전달하지 않아
    # 클라가 텍스트 추출(기본) + 페이지 렌더(폴백) 둘 다 해야 한다 — 그 둘을 한 패키지로
    # 커버하는 게 PyMuPDF 뿐이다(pypdf 는 렌더 불가).
    "pymupdf>=1.28",
]

[project.scripts]
codyssey = "codyssey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
