[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvda-analysis"
version = "0.1.0"
description = "NVDA(엔비디아) 2년 일봉 시계열 분석 — 코디세이 M1-1 미션 답안"
readme = "docs/모범답안-M1-1.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
