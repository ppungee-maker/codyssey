<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Mate UI</title>
    <style>
        :root {
            --primary: #1e5fb4;
            --bg-light: #f4f7fa;
            --white: #ffffff;
            --text-dark: #2d3436;
            --text-muted: #636e72;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e0e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px 0;
        }

        /* Mobile Frame */
        .screen {
            width: 380px;
            height: 675px; /* 9:16 ratio approx */
            background-color: var(--bg-light);
            border-radius: 40px;
            border: 8px solid #2d3436;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Common Components */
        .header { padding: 25px 20px 10px; }
        .title { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; }
        
        .nav-bar {
            height: 70px;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .nav-item { width: 24px; height: 24px; background: #dfe6e9; border-radius: 6px; }
        .nav-item.active { background: var(--primary); }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }

        /* Screen 1: Main */
        .search-bar {
            background: var(--white);
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
        }
        .search-icon { width: 18px; height: 18px; border: 2px solid #b2bec3; border-radius: 50%; position: relative; }
        .search-icon::after { content: ''; position: absolute; width: 6px; height: 2px; background: #b2bec3; transform: rotate(45deg); bottom: -3px; right: -3px; }

        .dest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }
        .dest-card {
            height: 160px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            align-items: flex-end;
            padding: 15px;
            color: white;
            font-weight: 600;
        }
        .dest-card.city { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .dest-card.mountain { background: linear-gradient(135deg, #55efc4, #00b894); grid-column: span 2; height: 120px; }

        /* Screen 2: Detail */
        .banner {
            height: 300px;
            background: linear-gradient(to bottom, #1e5fb4, #74b9ff);
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .detail-content {
            background: var(--bg-light);
            flex: 1;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: -30px;
            padding: 30px 25px;
            position: relative;
        }
        .flight-info { font-size: 32px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; }
        .price-tag { font-size: 24px; color: var(--primary); font-weight: 700; margin-bottom: 30px; }
        .info-row { display: flex; gap: 20px; margin-bottom: 30px; }
        .info-box { flex: 1; background: white; padding: 15px; border-radius: 15px; border: 1px solid #eee; }
        .info-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }

        /* Screen 3: My Page */
        .profile-section {
            text-align: center;
            padding: 40px 20px;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(45deg, #dfe6e9, #b2bec3);
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid white;
            box-shadow: var(--card-shadow);
        }
        .user-name { font-size: 20px; font-weight: 700; color: var(--text-dark); }
        
        .booking-list { padding: 0 20px; }
        .booking-card {
            background: var(--white);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
        }
        .booking-img { width: 50px; height: 50px; border-radius: 12px; background: #eee; margin-right: 15px; }
        .booking-city { font-weight: 600; flex: 1; }
        .check-badge {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Screen 1: Main -->
    <section class="screen">
        <div class="header">
            <div class="search-bar">
                <div class="search-icon"></div>
            </div>
            <h1 class="title">Destinations</h1>
        </div>
        <div class="dest-grid">
            <div class="dest-card">Beach</div>
            <div class="dest-card city">City</div>
            <div class="dest-card mountain">Mountain</div>
        </div>
        <nav class="nav-bar">
            <div class="nav-item active"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
        </nav>
    </section>

    <!-- Screen 2: Detail -->
    <section class="screen">
        <div class="banner">
            <div class="back-btn">←</div>
        </div>
        <div class="detail-content">
            <div class="flight-info">JFK → LAX</div>
            <div class="price-tag">$482</div>
            <div class="info-row">
                <div class="info-box">
                    <div class="info-label">Date</div>
                    <div style="font-weight:600">Oct 24</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Gate</div>
                    <div style="font-weight:600">B12</div>
                </div>
            </div>
            <button class="btn-primary">Book Now</button>
        </div>
    </section>

    <!-- Screen 3: My Page -->
    <section class="screen">
        <div class="profile-section">
            <div class="avatar"></div>
            <div class="user-name">JOHN DOE</div>
        </div>
        <div class="booking-list">
            <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text-muted);">Recent Bookings</h3>
            <div class="booking-card">
                <div class="booking-img" style="background: #fab1a0"></div>
                <div class="booking-city">Paris</div>
                <div class="check-badge">✓</div>
            </div>
            <div class="booking-card">
                <div class="booking-img" style="background: #81ecec"></div>
                <div class="booking-city">Tokyo</div>
                <div class="check-badge">✓</div>
            </div>
            <div class="booking-card">
                <div class="booking-img" style="background: #ffeaa7"></div>
                <div class="booking-city">Rome</div>
                <div class="check-badge">✓</div>
            </div>
        </div>
        <nav class="nav-bar">
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item active"></div>
        </nav>
    </section>

</body>
</html>
